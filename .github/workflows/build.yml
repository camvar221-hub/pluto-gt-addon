name: Build
on:
  push:
  schedule:
    - cron: '0 */3 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - run: |
          curl -sL https://i.mjh.nz/PlutoTV/mx.m3u8 -o p.m3u
          python3 - << 'PY'
          import re, json, os, pathlib
          pathlib.Path("catalog/tv").mkdir(parents=True, exist_ok=True)
          pathlib.Path("meta/tv").mkdir(parents=True, exist_ok=True)
          pathlib.Path("stream/tv").mkdir(parents=True, exist_ok=True)
          metas=[]
          ch=[]
          with open("p.m3u",encoding="utf-8",errors="ignore") as f: lines=f.readlines()
          c=0
          for i in range(len(lines)):
            if lines[i].startswith("#EXTINF"):
              m=re.search(r',(.+)$', lines[i]); name=m.group(1).strip() if m else f"Canal {c}"
              l=re.search(r'tvg-logo="([^"]+)"', lines[i]); logo=l.group(1) if l else ""
              if i+1 < len(lines) and lines[i+1].startswith("http"):
                url=lines[i+1].strip()
                if c<35:
                  pid=f"pluto_mx_{c}"
                  ch.append((pid,name,logo,url))
                c+=1
          catalog=[]
          for pid,name,logo,url in ch:
            catalog.append({"id":pid,"type":"tv","name":name,"poster":logo,"posterShape":"landscape"})
            json.dump({"meta":{"id":pid,"type":"tv","name":name,"poster":logo,"logo":logo,"description":name,"videos":[{"id":f"{pid}:1","title":name}]}}, open(f"meta/tv/{pid}.json","w"))
            json.dump({"streams":[{"url":url,"title":name,"name":"Pluto MX"}]}, open(f"stream/tv/{pid}.json","w"))
          json.dump({"metas":catalog}, open("catalog/tv/pluto_gt.json","w"))
          json.dump({"id":"com.camvar.plutogt.mx","version":"4.0.0","name":"Pluto TV GT - HECHO","description":"35 canales MX funcionando en GT","resources":["catalog","meta","stream"],"types":["tv"],"catalogs":[{"type":"tv","id":"pluto_gt","name":"Pluto GT"}],"idPrefixes":["pluto_"]}, open("manifest.json","w"))
          print(f"OK {len(ch)} canales")
          PY
          git config user.name bot; git config user.email bot@bot.com
          git add .; git commit -m "hecho mx" || true; git push
